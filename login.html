<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickPay</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="container">
        <div id="left_side">
            <div id="brand">
                <h1>Quick Pay</h1>
                <p>Pay Anywhere. Anytime.</p>
            </div>
        </div>

        <div id="right-side">
            <div id="login-box">
                <h2>Welcome Back</h2>
                <p id="subtitle">Login to continue</p>
                <form id="login-form">
                    <div id="imput-box">
                        <label>Email</label>
                        <div id="input-field">
                            <input type="email" id="email" placeholder="Enter your email">
                        </div>
                        <small id="emailError"></small>
                    </div>

                    <div id="input-box">
                        <label>Password</label>
                        <div id="input-field">
                            <input type="password" id="password" placeholder="Enter your password">
                        </div>
                        <small id="errorpassword"></small>
                    </div>

                    <div id="options">
                        <label>
                            <input type="checkbox">
                            Remember me?
                        </label>
                        <a href="#">Forgot Password</a>
                    </div>

                    <button id="submit" type="button">
                        Login
                    </button>
                </form>

                <div id="signup">
                    Don't have an account?
                    <a href="#">signup</a>
                </div>
            </div>
        </div>
    </div>

    <script src="jss/login.js"></script>
</body>
</html>
